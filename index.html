<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Calculator</title>
  <meta name="description" content="Scientific calculator: exact fractions, equations, statistics, tables, calculus and base-N.">
  <meta name="theme-color" content="#16181d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="calc">
    <header class="brand">
      <span class="brand-name">CALCULATOR</span>
      <span class="brand-sub">SCIENTIFIC · NATURAL</span>
    </header>

    <section class="screen" aria-live="polite">
      <div class="status" id="status"></div>
      <div class="screen-body" id="screen-body"></div>
      <div class="softkeys" id="softkeys" hidden></div>
    </section>

    <section class="keypad" id="keypad">
      <div class="fn-pad" id="fn-pad"></div>
      <div class="num-pad" id="num-pad"></div>
    </section>
  </main>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <span id="sheet-title"></span>
        <button type="button" id="sheet-close" aria-label="Close">✕</button>
      </div>
      <div class="sheet-list" id="sheet-list"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
